[project]
name = "yukti"
version = "0.1.0"
description = "Integrated secure data erasure and forensic recovery toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yukti = "yukti.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
